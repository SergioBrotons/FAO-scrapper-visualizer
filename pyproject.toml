[project]
name = "geneva-property-transactions"
version = "0.1.0"
description = "Pipeline for collecting Geneva FAO real-estate transactions and enriching with SITG cadastral data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pymupdf>=1.25.0",
    "pdfplumber>=0.11.0",
    "pyyaml>=6.0.2",
    "shapely>=2.0.6",
    "pyproj>=3.7.0",
    "pandas>=2.2.3",
    "openpyxl>=3.1.5",
    "rich>=13.9.4",
    "typer>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fao_transactions"]
